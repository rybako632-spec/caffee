<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — Caffe-23</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #120b07;
      color: #fff;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at top, #3a1d0e 0%, #120b07 55%);
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #1d120c;
      border: 1px solid #4a2a18;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    .login-box h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .login-box p {
      color: #a99486;
      margin: 0 0 25px;
    }

    .admin-wrapper {
      display: none;
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(18,11,7,.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #3c2416;
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .user-email {
      color: #bda99b;
      font-size: 13px;
      margin-top: 4px;
    }

    .logout-btn {
      border: 1px solid #6a3c20;
      background: #24150d;
      color: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
    }

    .logout-btn:hover {
      background: #352014;
    }

    main {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 25px 20px 50px;
    }

    .form-box {
      background: #1d120c;
      border: 1px solid #432716;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 30px;
    }

    .form-box h2 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      color: #c8b5a7;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #52301d;
      background: #110a06;
      color: #fff;
      border-radius: 10px;
      padding: 12px 13px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #d87731;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .photo-preview {
      display: none;
      margin-top: 10px;
      width: 140px;
      height: 100px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #54301b;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-primary {
      background: #d87731;
      color: #160b05;
    }

    .btn-primary:hover {
      background: #ef8b40;
    }

    .btn-secondary {
      background: #352015;
      color: #fff;
      border: 1px solid #54301b;
    }

    .message {
      margin-top: 12px;
      min-height: 20px;
      font-size: 14px;
    }

    .dishes-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      gap: 10px;
    }

    .dishes-title h2 {
      margin: 0;
    }

    .dishes-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .dish-card {
      background: #1d120c;
      border: 1px solid #432716;
      border-radius: 16px;
      overflow: hidden;
    }

    .dish-image {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
      background: #100906;
    }

    .no-image {
      height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #806d5e;
      background: #100906;
    }

    .dish-content {
      padding: 16px;
    }

    .dish-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .dish-title {
      font-size: 19px;
      font-weight: 700;
      margin: 0;
    }

    .dish-price {
      color: #e88a40;
      font-weight: 700;
      white-space: nowrap;
    }

    .dish-meta {
      color: #9f8c7e;
      font-size: 13px;
      margin-top: 7px;
    }

    .dish-description {
      color: #c3b1a3;
      font-size: 14px;
      line-height: 1.5;
      margin: 12px 0 0;
    }

    .card-buttons {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .edit-btn,
    .delete-btn {
      flex: 1;
      border: 0;
      padding: 10px;
      border-radius: 9px;
      cursor: pointer;
    }

    .edit-btn {
      background: #3b2416;
      color: #fff;
    }

    .delete-btn {
      background: #5b211c;
      color: #fff;
    }

    .edit-btn:hover {
      background: #4a2c1b;
    }

    .delete-btn:hover {
      background: #742a23;
    }

    .loading {
      text-align: center;
      color: #9f8c7e;
      padding: 30px;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .dishes-list {
        grid-template-columns: 1fr;
      }

      .header-inner {
        align-items: flex-start;
      }

      .user-email {
        max-width: 180px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      main {
        padding: 18px 12px 40px;
      }

      .form-box {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <h1>🔐 Caffe-23</h1>
      <p>Вход в панель администратора</p>

      <form id="loginForm">

        <div class="field">
          <label>Email</label>
          <input
            type="email"
            id="loginEmail"
            placeholder="Введите email"
            required
          >
        </div>

        <br>

        <div class="field">
          <label>Пароль</label>
          <input
            type="password"
            id="loginPassword"
            placeholder="Введите пароль"
            required
          >
        </div>

        <div class="buttons">
          <button class="btn btn-primary" type="submit">
            Войти
          </button>
        </div>

        <div class="message" id="loginMessage"></div>

      </form>
    </div>
  </div>


  <!-- ADMIN -->
  <div class="admin-wrapper" id="adminWrapper">

    <header>
      <div class="header-inner">

        <div>
          <h1>☕ Caffe-23 — Админ-панель</h1>
          <div class="user-email" id="userEmail"></div>
        </div>

        <button class="logout-btn" id="logoutBtn">
          Выйти
        </button>

      </div>
    </header>


    <main>

      <!-- ADD / EDIT -->
      <section class="form-box">

        <h2 id="formTitle">Добавить блюдо</h2>

        <form id="dishForm">

          <div class="form-grid">

            <div class="field">
              <label>Название</label>
              <input
                type="text"
                id="dishTitle"
                placeholder="Например: Cappuccino"
                required
              >
            </div>

            <div class="field">
              <label>Категория</label>

              <select id="dishCategory" required>
                <option value="coffee">Кофе</option>
                <option value="bread">Выпечка</option>
              </select>

            </div>

            <div class="field">
              <label>Цена</label>
              <input
                type="text"
                id="dishPrice"
                placeholder="15 zł"
                required
              >
            </div>

            <div class="field">
              <label>Вес</label>
              <input
                type="text"
                id="dishWeight"
                placeholder="250 g"
              >
            </div>

            <div class="field full">
              <label>Описание</label>

              <textarea
                id="dishDescription"
                placeholder="Описание блюда..."
              ></textarea>

            </div>

            <div class="field full">

              <label>Фото</label>

              <input
                type="file"
                id="dishPhoto"
                accept="image/*"
              >

              <img
                id="photoPreview"
                class="photo-preview"
                alt="preview"
              >

            </div>

          </div>

          <div class="buttons">

            <button
              type="submit"
              class="btn btn-primary"
              id="saveBtn"
            >
              Добавить блюдо
            </button>

            <button
              type="button"
              class="btn btn-secondary"
              id="cancelEditBtn"
              style="display:none"
            >
              Отмена
            </button>

          </div>

          <div class="message" id="formMessage"></div>

        </form>

      </section>


      <!-- DISHES -->
      <section>

        <div class="dishes-title">
          <h2>Все блюда</h2>
        </div>

        <div
          class="dishes-list"
          id="dishesList"
        >
          <div class="loading">
            Загрузка...
          </div>
        </div>

      </section>

    </main>

  </div>


  <!-- FIREBASE -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    import {
      getDatabase,
      ref,
      push,
      set,
      remove,
      onValue
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


    /* =========================
       FIREBASE
    ========================= */

    const firebaseConfig = {
      apiKey: "AIzaSyDMCP6zNsRqw6fH4DBNUTG-Nqq_T_hUXv4",
      authDomain: "caffe-23.firebaseapp.com",
      databaseURL: "https://caffe-23-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "caffe-23",
      storageBucket: "caffe-23.firebasestorage.app",
      messagingSenderId: "768137369524",
      appId: "1:768137369524:web:50e6c4297a6af9cd4644e1",
      measurementId: "G-DBJ0E90LP9"
    };

    const CLOUD_NAME = "wtaymmya";
    const UPLOAD_PRESET = "Coffe.kurkod";


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getDatabase(app);


    /* =========================
       ELEMENTS
    ========================= */

    const loginScreen =
      document.getElementById("loginScreen");

    const adminWrapper =
      document.getElementById("adminWrapper");

    const loginForm =
      document.getElementById("loginForm");

    const loginEmail =
      document.getElementById("loginEmail");

    const loginPassword =
      document.getElementById("loginPassword");

    const loginMessage =
      document.getElementById("loginMessage");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const userEmail =
      document.getElementById("userEmail");

    const dishForm =
      document.getElementById("dishForm");

    const dishTitle =
      document.getElementById("dishTitle");

    const dishCategory =
      document.getElementById("dishCategory");

    const dishPrice =
      document.getElementById("dishPrice");

    const dishWeight =
      document.getElementById("dishWeight");

    const dishDescription =
      document.getElementById("dishDescription");

    const dishPhoto =
      document.getElementById("dishPhoto");

    const photoPreview =
      document.getElementById("photoPreview");

    const dishesList =
      document.getElementById("dishesList");

    const saveBtn =
      document.getElementById("saveBtn");

    const cancelEditBtn =
      document.getElementById("cancelEditBtn");

    const formTitle =
      document.getElementById("formTitle");

    const formMessage =
      document.getElementById("formMessage");


    let editingId = null;
    let currentImageUrl = "";


    /* =========================
       ПРИНУДИТЕЛЬНЫЙ LOGOUT
       =========================

       Каждый раз при открытии admin.html
       пользователь будет разлогинен.

       Поэтому пароль нужно вводить заново.
    */

    try {
      await signOut(auth);
    } catch (error) {
      console.log("No previous session");
    }


    /* =========================
       LOGIN
    ========================= */

    loginForm.addEventListener("submit", async (e) => {

      e.preventDefault();

      loginMessage.textContent = "Вход...";

      try {

        await signInWithEmailAndPassword(
          auth,
          loginEmail.value.trim(),
          loginPassword.value
        );

        loginMessage.textContent = "";

      } catch (error) {

        console.error(error);

        loginMessage.textContent =
          "Неверный email или пароль.";

      }

    });


    /* =========================
       AUTH STATE
    ========================= */

    onAuthStateChanged(auth, (user) => {

      if (user) {

        loginScreen.style.display = "none";
        adminWrapper.style.display = "block";

        userEmail.textContent =
          user.email || "";

        loadDishes();

      } else {

        loginScreen.style.display = "flex";
        adminWrapper.style.display = "none";

        userEmail.textContent = "";

      }

    });


    /* =========================
       LOGOUT
    ========================= */

    logoutBtn.addEventListener("click", async () => {

      await signOut(auth);

      loginEmail.value = "";
      loginPassword.value = "";

    });


    /* =========================
       CLOUDINARY
    ========================= */

    async function uploadImage(file) {

      if (!file) {
        return currentImageUrl || "";
      }

      const formData = new FormData();

      formData.append(
        "file",
        file
      );

      formData.append(
        "upload_preset",
        UPLOAD_PRESET
      );

      const response = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
        {
          method: "POST",
          body: formData
        }
      );

      const result = await response.json();

      if (!response.ok) {

        console.error(result);

        throw new Error(
          result.error?.message ||
          "Ошибка загрузки изображения"
        );

      }

      return result.secure_url;

    }


    /* =========================
       PHOTO PREVIEW
    ========================= */

    dishPhoto.addEventListener("change", () => {

      const file = dishPhoto.files[0];

      if (!file) {
        return;
      }

      const url =
        URL.createObjectURL(file);

      photoPreview.src = url;
      photoPreview.style.display = "block";

    });


    /* =========================
       ADD / EDIT
    ========================= */

    dishForm.addEventListener("submit", async (e) => {

      e.preventDefault();

      const user = auth.currentUser;

      if (!user) {
        alert("Сначала войдите в админ-панель.");
        return;
      }

      saveBtn.disabled = true;

      formMessage.textContent =
        "Сохранение...";

      try {

        let imageUrl = currentImageUrl || "";

        if (dishPhoto.files[0]) {

          formMessage.textContent =
            "Загрузка фотографии...";

          imageUrl =
            await uploadImage(
              dishPhoto.files[0]
            );

        }

        const dishData = {

          title:
            dishTitle.value.trim(),

          category:
            dishCategory.value,

          price:
            dishPrice.value.trim(),

          weight:
            dishWeight.value.trim(),

          description:
            dishDescription.value.trim(),

          imageUrl:
            imageUrl

        };


        /* EDIT */

        if (editingId) {

          await set(
            ref(
              db,
              "dishes/" + editingId
            ),
            {
              ...dishData,

              updatedAt:
                new Date().toISOString()
            }
          );

          formMessage.textContent =
            "Блюдо обновлено.";

        }

        /* ADD */

        else {

          const newDish =
            push(
              ref(db, "dishes")
            );

          await set(
            newDish,
            {
              ...dishData,

              createdAt:
                new Date().toISOString(),

              createdBy:
                auth.currentUser?.email || ""
            }
          );

          formMessage.textContent =
            "Блюдо добавлено.";

        }


        resetForm();

      } catch (error) {

        console.error(error);

        formMessage.textContent =
          "Ошибка: " +
          error.message;

      }

      saveBtn.disabled = false;

    });


    /* =========================
       LOAD DISHES
    ========================= */

    function loadDishes() {

      const dishesRef =
        ref(db, "dishes");

      onValue(
        dishesRef,
        (snapshot) => {

          dishesList.innerHTML = "";

          const data =
            snapshot.val();

          if (!data) {

            dishesList.innerHTML = `
              <div class="loading">
                Блюд пока нет.
              </div>
            `;

            return;
          }


          const dishes =
            Object.entries(data)
              .map(([id, item]) => ({
                id,
                ...item
              }))
              .reverse();


          dishes.forEach((item) => {

            const card =
              document.createElement("div");

            card.className =
              "dish-card";


            const imageHTML =
              item.imageUrl

                ? `
                  <img
                    class="dish-image"
                    src="${escapeHTML(item.imageUrl)}"
                    alt="${escapeHTML(item.title || "")}"
                  >
                `

                : `
                  <div class="no-image">
                    Нет фотографии
                  </div>
                `;


            card.innerHTML = `

              ${imageHTML}

              <div class="dish-content">

                <div class="dish-top">

                  <h3 class="dish-title">
                    ${escapeHTML(item.title || "Без названия")}
                  </h3>

                  <div class="dish-price">
                    ${escapeHTML(item.price || "")}
                  </div>

                </div>


                <div class="dish-meta">

                  ${
                    item.category === "coffee"
                      ? "☕ Кофе"
                      : "🥐 Выпечка"
                  }

                  ${
                    item.weight
                      ? " • " + escapeHTML(item.weight)
                      : ""
                  }

                </div>


                <p class="dish-description">
                  ${escapeHTML(item.description || "")}
                </p>


                <div class="card-buttons">

                  <button
                    class="edit-btn"
                    data-id="${item.id}"
                  >
                    Изменить
                  </button>

                  <button
                    class="delete-btn"
                    data-id="${item.id}"
                  >
                    Удалить
                  </button>

                </div>

              </div>

            `;


            dishesList.appendChild(card);

          });


          /* EDIT BUTTONS */

          document
            .querySelectorAll(".edit-btn")
            .forEach((button) => {

              button.addEventListener(
                "click",
                () => {

                  const id =
                    button.dataset.id;

                  editDish(
                    id,
                    data[id]
                  );

                }
              );

            });


          /* DELETE BUTTONS */

          document
            .querySelectorAll(".delete-btn")
            .forEach((button) => {

              button.addEventListener(
                "click",
                async () => {

                  const id =
                    button.dataset.id;

                  const item =
                    data[id];

                  const confirmed =
                    confirm(
                      `Удалить "${item.title || "это блюдо"}"?`
                    );

                  if (!confirmed) {
                    return;
                  }

                  try {

                    await remove(
                      ref(
                        db,
                        "dishes/" + id
                      )
                    );

                  } catch (error) {

                    console.error(error);

                    alert(
                      "Ошибка удаления: " +
                      error.message
                    );

                  }

                }
              );

            });

        },

        (error) => {

          console.error(error);

          dishesList.innerHTML = `
            <div class="loading">
              Ошибка загрузки блюд.
            </div>
          `;

        }
      );

    }


    /* =========================
       EDIT DISH
    ========================= */

    function editDish(id, item) {

      editingId = id;

      currentImageUrl =
        item.imageUrl || "";


      dishTitle.value =
        item.title || "";

      dishCategory.value =
        item.category || "coffee";

      dishPrice.value =
        item.price || "";

      dishWeight.value =
        item.weight || "";

      dishDescription.value =
        item.description || "";


      dishPhoto.value = "";


      if (currentImageUrl) {

        photoPreview.src =
          currentImageUrl;

        photoPreview.style.display =
          "block";

      } else {

        photoPreview.style.display =
          "none";

      }


      formTitle.textContent =
        "Редактировать блюдо";

      saveBtn.textContent =
        "Сохранить изменения";

      cancelEditBtn.style.display =
        "block";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* =========================
       CANCEL EDIT
    ========================= */

    cancelEditBtn.addEventListener(
      "click",
      () => {

        resetForm();

      }
    );


    /* =========================
       RESET FORM
    ========================= */

    function resetForm() {

      editingId = null;

      currentImageUrl = "";

      dishForm.reset();

      dishCategory.value =
        "coffee";

      photoPreview.src = "";

      photoPreview.style.display =
        "none";

      formTitle.textContent =
        "Добавить блюдо";

      saveBtn.textContent =
        "Добавить блюдо";

      cancelEditBtn.style.display =
        "none";

      setTimeout(() => {

        formMessage.textContent = "";

      }, 2500);

    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHTML(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }

  </script>

</body>
</html>
